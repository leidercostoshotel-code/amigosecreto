<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigo Secreto 🎁</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #667eea;
            border-radius: 10px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 15px rgba(118, 75, 162, 0.3);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .participants-list {
            text-align: left;
            margin: 20px 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .participant-item {
            background: #f0f0f0;
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .remove-btn {
            background: #ff4757;
            padding: 5px 15px;
            font-size: 14px;
        }

        .select-section {
            margin: 30px 0;
        }

        .select-section select {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #667eea;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .reveal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .reveal-box {
            background: white;
            padding: 60px;
            border-radius: 30px;
            text-align: center;
            position: relative;
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
            max-width: 600px;
        }

        @keyframes popIn {
            0% {
                transform: scale(0) rotate(180deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .reveal-box h2 {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 20px #667eea, 0 0 30px #667eea;
            }
            50% {
                text-shadow: 0 0 30px #764ba2, 0 0 40px #764ba2;
            }
        }

        .secret-friend {
            font-size: 2.5em;
            color: #764ba2;
            font-weight: bold;
            margin: 30px 0;
            padding: 20px;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-radius: 15px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .funny-phrase {
            font-size: 1.3em;
            color: #555;
            font-style: italic;
            margin: 20px 0;
            line-height: 1.6;
        }

        .close-btn {
            background: #ff4757;
            margin-top: 20px;
        }

        .balloon {
            position: fixed;
            width: 60px;
            height: 75px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            z-index: 999;
            animation: floatUp 5s ease-out forwards;
            box-shadow: inset -10px -10px 20px rgba(0, 0, 0, 0.1);
        }

        .balloon::before {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            width: 2px;
            height: 40px;
            background: #333;
            transform: translateX(-50%);
        }

        .balloon::after {
            content: '▼';
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            color: #333;
            font-size: 10px;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-150vh) translateX(var(--random-x)) rotate(var(--random-rotation));
                opacity: 0.3;
            }
        }

        @keyframes colorChange {
            0% { filter: hue-rotate(0deg) brightness(1.2); }
            25% { filter: hue-rotate(90deg) brightness(1.4); }
            50% { filter: hue-rotate(180deg) brightness(1.2); }
            75% { filter: hue-rotate(270deg) brightness(1.4); }
            100% { filter: hue-rotate(360deg) brightness(1.2); }
        }

        .balloon.color-changing {
            animation: floatUp 5s ease-out forwards, colorChange 3s ease-in-out infinite;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            animation: fall 4s linear infinite;
            z-index: 999;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .gift-3d {
            font-size: 100px;
            animation: spin3d 3s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes spin3d {
            0%, 100% {
                transform: rotateY(0deg) rotateX(0deg);
            }
            50% {
                transform: rotateY(180deg) rotateX(20deg);
            }
        }

        .hidden {
            display: none !important;
        }

        .floating-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 20px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(240, 147, 251, 0.5);
            z-index: 100;
            transition: all 0.3s;
            display: none;
            animation: pulse-float 2s ease-in-out infinite;
        }

        .floating-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(240, 147, 251, 0.7);
        }

        @keyframes pulse-float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .assignments-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        .assignments-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .assignments-box h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        .assignment-item {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
        }

        .assignment-arrow {
            color: #667eea;
            font-weight: bold;
            font-size: 24px;
        }

        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            overflow: hidden;
        }

        .intro-content {
            text-align: center;
            z-index: 2001;
            position: relative;
        }

        .intro-text {
            font-size: 3.5em;
            color: white;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8),
                         0 0 60px rgba(255, 255, 255, 0.5);
            margin: 30px 0;
            opacity: 0;
            animation: fadeInOut 3s ease-in-out forwards;
        }

        .intro-text:nth-child(1) { animation-delay: 0s; }
        .intro-text:nth-child(2) { animation-delay: 3s; }
        .intro-text:nth-child(3) { animation-delay: 6s; }
        .intro-text:nth-child(4) { animation-delay: 9s; }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: scale(0.5) translateY(50px);
            }
            15% {
                opacity: 1;
                transform: scale(1.2) translateY(0);
            }
            30%, 70% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            85% {
                opacity: 1;
                transform: scale(1.1) translateY(-20px);
            }
            100% {
                opacity: 0;
                transform: scale(0.8) translateY(-50px);
            }
        }

        .background-balloon {
            position: absolute;
            width: 80px;
            height: 100px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            opacity: 0.3;
            animation: floatBackground 8s ease-in-out infinite;
        }

        @keyframes floatBackground {
            0%, 100% {
                transform: translateY(0) translateX(0) rotate(0deg);
            }
            25% {
                transform: translateY(-30px) translateX(20px) rotate(5deg);
            }
            50% {
                transform: translateY(-50px) translateX(-20px) rotate(-5deg);
            }
            75% {
                transform: translateY(-30px) translateX(15px) rotate(3deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎁 Amigo Secreto 🎁</h1>
        
        <div class="input-group" id="inputSection">
            <input type="text" id="nameInput" placeholder="Escribe el nombre del participante">
            <button onclick="addParticipant()">Agregar Participante</button>
        </div>

        <div class="participants-list" id="participantsList"></div>

        <button onclick="assignSecretFriends()" id="assignBtn" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
            Asignar Amigos Secretos
        </button>

        <div class="select-section hidden" id="selectSection">
            <h3 style="color: #667eea; margin-bottom: 15px;">Selecciona tu nombre:</h3>
            <select id="nameSelect">
                <option value="">-- Elige tu nombre --</option>
            </select>
            <button onclick="revealMyFriend()">✨ Ver Mi Confidente ✨</button>
        </div>
    </div>

    <div class="reveal-container" id="revealContainer">
        <div class="reveal-box">
            <div class="gift-3d">🎁</div>
            <h2>¡Tu Amigo Secreto es!</h2>
            <div class="secret-friend" id="secretFriendName">---</div>
            <div class="funny-phrase" id="funnyPhrase"></div>
            <button class="close-btn" onclick="closeReveal()">Cerrar</button>
        </div>
    </div>

    <div class="intro-screen" id="introScreen">
        <div class="intro-content">
            <div class="intro-text">La Familia es todo 🎉</div>
            <div class="intro-text">La Familia es lo mejor 💼</div>
            <div class="intro-text">Tener Familia es un tesoro 🤝</div>
            <div class="intro-text">Mi Familia, Tu Familia, Nuestra Familia ✨</div>
        </div>
    </div>

    <div class="assignments-modal" id="assignmentsModal">
        <div class="assignments-box">
            <h2>📋 Lista de Asignaciones</h2>
            <div id="assignmentsList"></div>
            <button onclick="closeAssignments()" style="width: 100%; margin-top: 20px;">Cerrar</button>
        </div>
    </div>

    <button class="floating-button" id="floatingBtn" onclick="showAssignments()">
        👀 Ver Asignaciones
    </button>

    <script>
        let participants = [];
        let assignments = {};
        let revealedNames = [];

        const funnyPhrases = [
            "¡Prepárate para ser el Santa Claus más sigiloso del año! 🎅",
            "Con grandes regalos vienen grandes responsabilidades... ¡y también grandes sonrisas! 😄",
            "La amistad es como un regalo: mejor cuando es sorpresa 🎉",
            "Recuerda: lo que pasa en el amigo secreto, se queda en el amigo secreto 🤫",
            "¡Es hora de poner tu creatividad en modo LEGENDARIO! 🌟",
            "Un buen amigo te conoce bien, un amigo secreto... te conoce TODO 👀",
            "¡Que comience la operación regalo perfecto! Misión: hacer sonreír 😊",
            "Dicen que el dinero no compra la felicidad, pero un buen regalo de amigo secreto... ¡se acerca! 💝",
            "Plot twist: ¡Ahora eres oficialmente un agente secreto del regalo! 🕵️",
            "La vida es mejor cuando compartes regalos con amigos... ¡sobre todo cuando es secreto! 🎊"
        ];

        function addParticipant() {
            const input = document.getElementById('nameInput');
            const name = input.value.trim();
            
            if (name && !participants.includes(name)) {
                participants.push(name);
                updateParticipantsList();
                input.value = '';
            }
        }

        function updateParticipantsList() {
            const list = document.getElementById('participantsList');
            list.innerHTML = '';
            
            participants.forEach((name, index) => {
                const item = document.createElement('div');
                item.className = 'participant-item';
                item.innerHTML = `
                    <span>${name}</span>
                    <button class="remove-btn" onclick="removeParticipant(${index})">Eliminar</button>
                `;
                list.appendChild(item);
            });
        }

        function removeParticipant(index) {
            participants.splice(index, 1);
            updateParticipantsList();
        }

        function assignSecretFriends() {
            if (participants.length < 2) {
                alert('Necesitas al menos 2 participantes');
                return;
            }

            // Algoritmo para asegurar que nadie se toque a sí mismo
            let validAssignment = false;
            let attempts = 0;
            const maxAttempts = 1000;

            while (!validAssignment && attempts < maxAttempts) {
                const shuffled = [...participants].sort(() => Math.random() - 0.5);
                assignments = {};
                validAssignment = true;
                
                for (let i = 0; i < participants.length; i++) {
                    const giver = participants[i];
                    const receiver = shuffled[i];
                    
                    // Verificar que nadie se toque a sí mismo
                    if (giver === receiver) {
                        validAssignment = false;
                        break;
                    }
                    
                    assignments[giver] = receiver;
                }
                
                attempts++;
            }

            if (!validAssignment) {
                alert('No se pudo generar una asignación válida. Por favor intenta de nuevo.');
                return;
            }
            
            // Ocultar sección de entrada y mostrar selector
            document.getElementById('inputSection').classList.add('hidden');
            document.getElementById('participantsList').classList.add('hidden');
            document.getElementById('assignBtn').classList.add('hidden');
            document.getElementById('selectSection').classList.remove('hidden');
            
            updateNameSelect();
            
            alert('¡Amigos secretos asignados! Ahora cada persona debe seleccionar su nombre.');
        }

        function updateNameSelect() {
            const select = document.getElementById('nameSelect');
            select.innerHTML = '<option value="">-- Elige tu nombre --</option>';
            
            const remainingNames = participants.filter(name => !revealedNames.includes(name));
            
            remainingNames.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });

            // Si todos vieron su confidente, mostrar el botón de asignaciones
            if (revealedNames.length === participants.length) {
                document.getElementById('floatingBtn').style.display = 'block';
                alert('🎉 ¡Todos han visto su amigo secreto! Ahora puedes ver todas las asignaciones presionando el botón flotante.');
            }
        }

        function revealMyFriend() {
            const select = document.getElementById('nameSelect');
            const name = select.value;
            
            if (!name) {
                alert('Por favor selecciona tu nombre');
                return;
            }

            if (revealedNames.includes(name)) {
                alert('Este nombre ya vio su confidente');
                return;
            }

            // Mostrar pantalla de introducción
            const introScreen = document.getElementById('introScreen');
            introScreen.style.display = 'flex';
            createBackgroundBalloons();

            // Después de 12 segundos, mostrar la revelación
            setTimeout(() => {
                introScreen.style.display = 'none';
                document.querySelectorAll('.background-balloon').forEach(el => el.remove());
                
                document.getElementById('secretFriendName').textContent = assignments[name];
                document.getElementById('funnyPhrase').textContent = 
                    funnyPhrases[Math.floor(Math.random() * funnyPhrases.length)];
                
                revealedNames.push(name);
                updateNameSelect();
                
                createSpectacularBalloons();
                createConfetti();
                document.getElementById('revealContainer').style.display = 'flex';
            }, 12500);
        }

        function closeReveal() {
            document.getElementById('revealContainer').style.display = 'none';
            document.querySelectorAll('.balloon, .confetti').forEach(el => el.remove());
        }

        function createBackgroundBalloons() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#f0932b', '#eb4d4b', '#6c5ce7', '#ff85a2', '#5f27cd', '#00d2d3'];
            
            for (let i = 0; i < 20; i++) {
                const balloon = document.createElement('div');
                balloon.className = 'background-balloon';
                balloon.style.left = Math.random() * 100 + '%';
                balloon.style.top = Math.random() * 100 + '%';
                balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                balloon.style.animationDelay = Math.random() * 2 + 's';
                balloon.style.animationDuration = (6 + Math.random() * 4) + 's';
                document.getElementById('introScreen').appendChild(balloon);
            }
        }

        function showAssignments() {
            const list = document.getElementById('assignmentsList');
            list.innerHTML = '';
            
            Object.keys(assignments).forEach(giver => {
                const item = document.createElement('div');
                item.className = 'assignment-item';
                item.innerHTML = `
                    <span><strong>${giver}</strong></span>
                    <span class="assignment-arrow">➜</span>
                    <span><strong>${assignments[giver]}</strong></span>
                `;
                list.appendChild(item);
            });
            
            document.getElementById('assignmentsModal').style.display = 'flex';
        }

        function closeAssignments() {
            document.getElementById('assignmentsModal').style.display = 'none';
        }

        function createSpectacularBalloons() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#f0932b', '#eb4d4b', '#6c5ce7', '#ff85a2', '#5f27cd', '#00d2d3'];
            
            for (let i = 0; i < 25; i++) {
                setTimeout(() => {
                    const balloon = document.createElement('div');
                    balloon.className = 'balloon color-changing';
                    
                    const startX = Math.random() * 100;
                    const randomXMove = (Math.random() - 0.5) * 200;
                    const randomRotation = (Math.random() - 0.5) * 360;
                    
                    balloon.style.left = startX + '%';
                    balloon.style.bottom = '-100px';
                    balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    balloon.style.setProperty('--random-x', randomXMove + 'px');
                    balloon.style.setProperty('--random-rotation', randomRotation + 'deg');
                    balloon.style.animationDelay = (Math.random() * 0.5) + 's';
                    balloon.style.animationDuration = (4 + Math.random() * 2) + 's';
                    
                    document.body.appendChild(balloon);
                    
                    setTimeout(() => balloon.remove(), 6000);
                }, i * 150);
            }
        }

        function createConfetti() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#f0932b', '#eb4d4b', '#6c5ce7'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = -10 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.animationDuration = (3 + Math.random() * 2) + 's';
                document.body.appendChild(confetti);
            }
        }

        document.getElementById('nameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addParticipant();
            }
        });
    </script>
</body>
</html>
